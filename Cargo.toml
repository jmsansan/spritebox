[package]
name = "spritebox"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jose Sanchez <jose.sansan@proton.me>"]
description = "Create 2D pixel art and game assets from text: sprites, backgrounds with parallax, tilemaps, procedural textures, UI and pixel fonts. A zero-dependency Rust library and CLI with PNG, atlas and TTF export."
license = "MIT"
repository = "https://github.com/jmsansan/spritebox"
documentation = "https://docs.rs/spritebox"
readme = "README.md"
keywords = ["pixel-art", "sprite", "gamedev", "tilemap", "procedural"]
categories = ["game-development", "multimedia::images", "graphics", "command-line-utilities"]
include = ["/Cargo.toml", "/Cargo.lock", "/src/**", "/tests/**", "/examples/*.rs", "/examples/*.spritebox", "/examples/night_shift/**", "/docs/backgrounds.md", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[dependencies]

[[bin]]
name = "spritebox"
path = "src/main.rs"
